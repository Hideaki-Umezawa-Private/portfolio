<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <script>
      // 存在しないURLへのアクセス時に配信される。
      if (location.hostname === 'hideaki-umezawa-private.github.io') {
        // GitHub Pagesはもう正式な公開先ではないため、sabaume.comへ転送する。
        var path = location.pathname.replace(/^\/portfolio/, '') || '/'
        location.replace('https://sabaume.com' + path + location.search + location.hash)
      } else {
        // Cloudflare Pages等: 各ページはビルド時にHTMLとして書き出しているため、
        // ここに来るのは存在しないURLのみ。トップページへ案内する。
        location.replace('/')
      }
    </script>
  </head>
  <body></body>
</html>
