<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages は正式な公開先ではなくなったため、sabaume.com へ転送する。
      // パス(/portfolio/以下)・検索・hashはそのまま引き継ぐ。
      if (location.hostname === 'hideaki-umezawa-private.github.io') {
        var path = location.pathname.replace(/^\/portfolio/, '') || '/'
        location.replace('https://sabaume.com' + path + location.search + location.hash)
      }
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%camel.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%camel.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#B0693B" />
    <meta name="apple-mobile-web-app-title" content="砂漠の梅" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="砂漠の梅（梅澤英昭）のポートフォリオサイト。ホームページ制作からWebシステム開発、業務改善・運用サポートまで、ご相談から公開後まで一貫して対応します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="砂漠の梅" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="砂漠の梅｜ともに、その先へ。" />
    <meta
      property="og:description"
      content="ホームページ制作からWebシステム開発、業務改善・運用サポートまで一貫して対応するWebパートナーです。"
    />
    <meta
      property="og:url"
      content="https://hideaki-umezawa-private.github.io/portfolio/"
    />
    <meta
      property="og:image"
      content="https://hideaki-umezawa-private.github.io/portfolio/camel.png"
    />
    <meta name="twitter:card" content="summary" />
    <title>砂漠の梅｜ホームページ制作・Webシステム開発</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages はSPAの深いパスへの直アクセス/リロードで404を返すため、
      // 404.htmlからエンコードして戻されたパスをここで復元する。
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        if (redirect) {
          sessionStorage.removeItem('spa-redirect')
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
